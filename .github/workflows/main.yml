      - name: Version number
        run: echo "AB_VERSION=$((GITHUB_RUN_NUMBER + 100))" >> $GITHUB_ENV

      - name: Sign key lagayein
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "KEYSTORE_B64 secret nahi mila"; exit 1; fi
          echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > MyDownloader/app/ab-release.jks

      - name: Java 17 setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: APK banayein
        working-directory: MyDownloader
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: APK ka naam (version ke saath)
        run: cp MyDownloader/app/build/outputs/apk/release/app-release.apk "AB-Studio-2.0-build${{ env.AB_VERSION }}.apk"

      - name: Public release (app ke andar update)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.AB_VERSION }}
          name: AB Studio 2.0 · build ${{ env.AB_VERSION }}
          body: "AB Studio 2.0: ek bar, ek Settings, Roman Urdu, khud retry, token khabar, random waqt, chhutti, widget, digital ghari, waqfa."
          files: AB-Studio-2.0-build${{ env.AB_VERSION }}.apk
